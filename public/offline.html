<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — SIMRS Hospital</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #fff; padding: 2rem; text-align: center;
        }
        .card {
            max-width: 480px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
        }
        .icon {
            width: 80px; height: 80px; margin: 0 auto 1.5rem;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
        }
        h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
        p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 1.5rem; line-height: 1.6; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 0.75rem 1.75rem;
            background: #fff; color: #2563eb;
            border-radius: 50px; font-weight: 700;
            text-decoration: none; transition: transform 0.2s;
            border: none; cursor: pointer; font-size: 0.95rem;
        }
        .btn:hover { transform: translateY(-2px); }
        .status { margin-top: 1.5rem; font-size: 0.78rem; opacity: 0.7; }
        .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Tidak Ada Koneksi</h1>
        <p>Anda sedang offline. Beberapa halaman mungkin tidak tersedia. Periksa koneksi internet Anda lalu coba lagi.</p>
        <button type="button" class="btn" onclick="location.reload()">
            🔄 Coba Lagi
        </button>
        <div class="status">
            <span class="dot"></span> <span id="status">Offline</span>
        </div>
    </div>
    <script>
        function updateStatus() {
            var s = document.getElementById('status');
            var dot = document.querySelector('.dot');
            if (navigator.onLine) {
                s.textContent = 'Koneksi pulih — refresh halaman';
                dot.style.background = '#10b981';
                setTimeout(function () { location.reload(); }, 1500);
            } else {
                s.textContent = 'Offline';
                dot.style.background = '#ef4444';
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
